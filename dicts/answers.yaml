ru:
  Start:
    - | 
      Приветствую!  
      Я могу напомнить вам о предстоящем событии. Для этого отправьте мне дату и время в формате  
      <b>ДД.ММ.ГГГГ ЧЧ:ММ</b> или просто укажите в тексте, например:  
      - "завтра в 18:00"  
      - "через 15 минут"  

      Я разберусь и напомню вам в нужное время! ⏰  
    - | 
      Здравствуйте!
      Я могу напомнить вам о предстоящем событии. Для этого отправьте мне дату и время в формате  
      <b>ДД.ММ.ГГГГ ЧЧ:ММ</b> или просто укажите в тексте, например:  
      - "завтра в 18:00"  
      - "через 15 минут"  

      Я разберусь и напомню вам в нужное время! ⏰  
  AlertSetted: |
    Хорошо, я напомню вам об этом {{alertTime}}

    Хотите ли оставить комментарий к напоминанию?
  CommentSetted: "Хорошо, я запомнил ваш комментарий."
  NoComment: "Я вас понял. Напомню вам вовремя."
  Default: "Извините, я вас не понимаю. Попробуйте еще раз."
  DefaultAlert: "Напоминаю вам о событии!"
  AlertWithComment: |
    Напоминаю вам о событии!  
    Комментарий: {{comment}}